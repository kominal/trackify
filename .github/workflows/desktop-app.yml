name: Desktop App
on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - desktop-app/**

# Two pushes in a row must not publish the same version twice.
concurrency:
  group: desktop-app
  cancel-in-progress: false

jobs:
  Release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop-app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      # A release is published once per version: bump desktop-app/package.json to ship a new installer.
      # Changes without a new version are built (so a broken build shows up) but not published.
      - name: Check version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installer
        if: steps.version.outputs.exists == 'true'
        run: npm run dist

      - name: Build and publish installer
        if: steps.version.outputs.exists == 'false'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep installer
        uses: actions/upload-artifact@v4
        with:
          name: Trackify-Setup-${{ steps.version.outputs.version }}
          path: desktop-app/release/*.exe
          if-no-files-found: error
