name: Frontend App
on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - frontend-app/**

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      # The workspace repo hosts the shared code (common/) this app builds against; it must be
      # checked out first, with trackify nested inside it at projects/trackify — the layout the
      # @kominal/common-angular file: dependency expects.
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          repository: kominal/workspace
          token: ${{ secrets.WORKSPACE_READ_TOKEN }}

      - name: Checkout trackify
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: projects/trackify

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/trackify/frontend-app/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install dependencies
        working-directory: projects/trackify/frontend-app
        run: npm install --force
      # Usage statistics go to Kominal Sentry (sentry.kominal.cloud). Its key is public (it ends up in
      # the page source) and kept as the organisation secret SENTRY_KEY; the branch name is reported
      # as the environment. Without the key the build carries no tracker.
      - name: Build
        working-directory: projects/trackify/frontend-app
        run: npm run build -- --define "SENTRY_KEY='${SENTRY_KEY}'" --define "SENTRY_ENVIRONMENT='${{ github.ref_name }}'"
        env:
          SENTRY_KEY: ${{ vars.SENTRY_KEY || secrets.SENTRY_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kominal/trackify/frontend-app
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: projects/trackify/frontend-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  Deployment:
    needs: Build
    uses: ./.github/workflows/deployment.yml
    secrets: inherit
