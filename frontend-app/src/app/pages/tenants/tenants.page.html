<div class="card min-h-19 shrink-0 flex-row! items-center justify-between gap-4">
  <h1 class="text-2xl font-semibold">{{ 'simple.tenants' | translate }}</h1>
  <div class="flex items-center gap-2">
    <p-button [attr.data-testid]="'tenants-filter-reset-button'" severity="secondary" [outlined]="true" size="small" icon="fas fa-filter-circle-xmark" [label]="'simple.resetFilter' | translate" (click)="resetFilter(table)" />
    @if (canCreate()) {
      <p-button [attr.data-testid]="'tenants-add-button'" size="small" icon="fa fa-add" [label]="'simple.add' | translate" (click)="openTenantAddDialog()" />
    }
  </div>
</div>
@if (applicationStateService.showHelp()) {
  <p-message severity="info">{{ 'help.tenants' | translate }}</p-message>
}
<div class="card h-full p-0!">
  <p-table
    #table
    class="overflow-auto"
    [value]="data()?.items || []"
    [lazy]="true"
    (onLazyLoad)="onLazyLoad($event)"
    stateStorage="local"
    stateKey="TENANTS_FILTER"
    (onStateRestore)="onStateRestore(table, $event)"
    dataKey="uuid"
    sortField="name"
    [sortOrder]="1"
    [scrollable]="true"
    scrollHeight="flex"
    [paginator]="true"
    [totalRecords]="data()?.count || 0"
    paginatorDropdownAppendTo="body"
    [rows]="50"
    [rowsPerPageOptions]="[50, 100, 200]"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">{{ 'simple.name' | translate }} <p-sort-icon field="name" /></th>
        <th class="w-0 text-end!">{{ 'simple.actions' | translate }}</th>
      </tr>
      <tr>
        <th><p-column-filter class="w-full" type="text" field="name" filterOn="input" /></th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-entity>
      <tr class="cursor-pointer hover:bg-neutral-100! dark:hover:bg-neutral-800!" [routerLink]="'/tenants/' + entity.uuid">
        <td>{{ entity.name }}</td>
        <td class="text-end!"><app-entity-info [entity]="entity" /></td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td class="text-center" colspan="100">{{ 'simple.noResults' | translate }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
