<p-menubar [model]="items()" class="flex min-h-14 items-center rounded-none! border-none!">
  <ng-template #start>
    @if (tenantService.tenant(); as tenant) {
      <button type="button" pRipple class="flex cursor-pointer items-center gap-2 rounded p-2 select-none hover:bg-neutral-100 dark:hover:bg-neutral-700" [attr.data-testid]="'header-tenant-menu'" (click)="tenantMenu.toggle($event)">
        <img src="/images/icon.svg" height="20" width="20" alt="" />
        <span class="font-semibold">{{ tenant.name }}</span>
        <i class="fas fa-chevron-down text-xs opacity-60"></i>
      </button>
    } @else {
      <div class="flex items-center gap-2 p-2 select-none">
        <img src="/images/icon.svg" height="20" width="20" alt="" />
        <span class="font-semibold">Trackify</span>
      </div>
    }
  </ng-template>
  <ng-template #end>
    <div class="flex items-center gap-2">
      @if (running(); as running) {
        <a class="border-surface-200 dark:border-surface-700 flex items-center gap-2 rounded-full border px-3 py-1 text-sm no-underline hover:bg-neutral-100 dark:hover:bg-neutral-700" [routerLink]="['/tenants', tenantService.tenant()?.uuid, 'tracking']" [attr.data-testid]="'header-running'">
          <span class="inline-block h-2.5 w-2.5 animate-pulse rounded-full" [style.background]="running.color"></span>
          <span class="text-color max-w-48 truncate">{{ running.name }}</span>
          <span class="text-color font-semibold tabular-nums">{{ running.clock }}</span>
        </a>
      }
      @if (oidcSecurityService.userData(); as user) {
        @if (user.userData; as userData) {
          <button type="button" pRipple class="flex cursor-pointer items-center justify-end gap-2 rounded p-2 select-none hover:bg-neutral-100 dark:hover:bg-neutral-700" [attr.data-testid]="'header-user-menu'" (click)="userMenu.toggle($event)">
            <span>{{ userData['given_name'] }} {{ userData['family_name'] }}</span>
            <i class="fas fa-chevron-down text-xs opacity-60"></i>
          </button>
        }
      }
    </div>
  </ng-template>
</p-menubar>
<p-menu #tenantMenu [model]="tenantMenuModel()" [popup]="true" />
<p-menu #userMenu [model]="userMenuModel()" [popup]="true" />
