Listen 8080
<VirtualHost *:8080>
    DocumentRoot /var/www/html
    Header set Connection keep-alive

    # Security headers. frame-ancestors/X-Frame-Options prevent clickjacking of destructive actions; nosniff blocks
    # MIME confusion; object-src/base-uri lock down plugin and base-tag injection.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

    <FilesMatch "\.(ico|flv|gif|swf|eot|woff|woff2|otf|ttf|svg)$">
        Header set Cache-Control "max-age=31536000, public"
        Header set Access-Control-Allow-Origin "*"
    </FilesMatch>
    <FilesMatch "\.(jpg|jpeg|png|webp|webm)$">
        Header set Cache-Control "max-age=31536000, public"
    </FilesMatch>
    <FilesMatch "\.(css)$">
        Header set Cache-Control "max-age=31536000, private"
    </FilesMatch>
    <FilesMatch "\.(js)$">
        Header set Cache-Control "max-age=31536000, private"
    </FilesMatch>
    # The tracker other sites embed. Its name carries no hash, so it must not be cached for a year
    # like the application bundles: an hour lets fixes reach visitors the same day.
    <Files "s.js">
        Header set Cache-Control "max-age=3600, public"
    </Files>
    <FilesMatch "\.(x?html?|php)$">
        Header set Cache-Control "max-age=600, private, must-revalidate"
    </FilesMatch>
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine on

        # Don't rewrite files or directories
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Rewrite everything else to index.html to allow HTML5 state links
        RewriteRule ^ index.html [L]
    </Directory>
</VirtualHost>
